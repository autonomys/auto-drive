name: Auth migrations and deployment

on:
  pull_request:
    paths:
      - "apps/auth/**"
      - "packages/models/**"
      - "yarn.lock"
      - "package.json"
      - ".yarnrc.yml"
      - ".github/workflows/auto-drive-auth-deploy.yml"
  push:
    branches: [main]
    paths:
      - "apps/auth/**"
      - "packages/models/**"
      - "yarn.lock"
      - "package.json"
      - ".yarnrc.yml"
      - ".github/workflows/auto-drive-auth-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Auth deployment environment
        type: choice
        options: [auth-staging, auth-production]
        default: auth-staging
        required: true
      operation:
        description: Plan, adopt verified legacy history, or migrate and deploy
        type: choice
        options: [plan, adopt, deploy]
        default: plan
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auth_migrations_test
          POSTGRES_PASSWORD: migration-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: apps/auth/flyway/pom.xml
      - name: Test and package Flyway
        run: mvn -B -ntp -f apps/auth/flyway/pom.xml verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/auth_migrations_test
      - name: Test deployment failure handling
        run: node --test apps/auth/scripts/deploy.test.mjs
      - name: Install workspace dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Build and test auth
        run: |
          yarn models build
          yarn auth lint
          yarn auth test
          yarn auth lambda:build
          zip -j apps/auth/build/index.zip apps/auth/build/index.js
      - uses: actions/upload-artifact@v4
        with:
          name: auth-deployment-${{ github.sha }}
          path: |
            apps/auth/build/index.zip
            apps/auth/flyway/target/auth-migrations.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    # Enable automatic production deployment only after staging and adoption.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && vars.AUTH_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: ${{ inputs.environment || 'auth-production' }}
    concurrency:
      group: auto-drive-auth-${{ inputs.environment || 'auth-production' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DSQL_CLUSTER_ENDPOINT: ${{ vars.DSQL_CLUSTER_ENDPOINT }}
      AUTH_DSQL_CLUSTER_ARN: ${{ vars.AUTH_DSQL_CLUSTER_ARN }}
      AUTH_LAMBDA_FUNCTION_NAME: ${{ vars.AUTH_LAMBDA_FUNCTION_NAME }}
      AUTH_BACKUP_VAULT: ${{ vars.AUTH_BACKUP_VAULT }}
      AUTH_BACKUP_ROLE_ARN: ${{ vars.AUTH_BACKUP_ROLE_ARN }}
      AUTH_BACKUP_RETENTION_DAYS: ${{ vars.AUTH_BACKUP_RETENTION_DAYS }}
      AUTH_OPERATION: ${{ inputs.operation || 'deploy' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: auth-deployment-${{ github.sha }}
          path: apps/auth
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AUTH_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 10800
      - name: Back up, migrate, verify, and deploy
        run: node apps/auth/scripts/deploy.mjs "$AUTH_OPERATION"
