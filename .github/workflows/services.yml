name: Services

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**" # Only trigger on changes within auth or backend
      - "apps/auth/**"
      - ".github/**"
      - "yarn.lock"
      - "scripts/check-polkadot-single-instance.mjs"
  pull_request:
    paths:
      - "apps/backend/**" # Only trigger on changes within auth or backend
      - "apps/auth/**"
      - ".github/**"
      - "yarn.lock"
      - "scripts/check-polkadot-single-instance.mjs"
  workflow_dispatch:

env:
  NEXT_PUBLIC_PROJECT_ID: "mocked-value-for-CI/CD"

jobs:
  backend-build-check:
    name: Services Build, Test and Lint Check
    runs-on: ubuntu-latest

    # Cache dependencies to speed up the workflow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Yarn
        run: corepack enable

      - name: Install dependencies
        run: corepack use yarn@4.2.2

      # The root project and the files-gateway project both write
      # submodules/files-gateway/node_modules, so the order root install,
      # gateway install, root install (the one inside `make -B all`) matters.
      # Later steps pass `-o` so make treats a prerequisite as already done.
      - name: Build all services
        run: make -B all

      - name: Check the backend loads one instance of each @polkadot package
        run: node scripts/check-polkadot-single-instance.mjs

      - name: Run lint
        run: make lint -o install

      - name: Run tests
        run: make test -o install -o common
