name: S3 Test Image

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "apps/auth/**"
      - "packages/models/**"
      - "packages/s3/**"
      - "submodules/**"
      - "nginx/nginx.conf"
      - "nginx/backend.mainnet.public.conf"
      - "docker/auto-drive-test/**"
      - "scripts/live-integration/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/auto-drive-test-image.yml"
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "apps/auth/**"
      - "packages/models/**"
      - "packages/s3/**"
      - "submodules/**"
      - "nginx/nginx.conf"
      - "nginx/backend.mainnet.public.conf"
      - "docker/auto-drive-test/**"
      - "scripts/live-integration/**"
      - "package.json"
      - "yarn.lock"
      - ".github/workflows/auto-drive-test-image.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/auto-drive-test
  # Tests use the latest rclone release from the first one with the Autonomys
  # provider, and this pre-release snapshot of rclone master until then.
  RCLONE_MIN_RELEASE: v1.76.0
  RCLONE_SNAPSHOT: 81e7372f6fbedfa80592e9a564593d63a8dc32f3

jobs:
  build-test:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test amd64 only; publishing builds and tests both.
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64", "arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/auto-drive-test/Dockerfile
          load: true
          tags: auto-drive-test:ci
          cache-from: type=gha,scope=auto-drive-test-${{ matrix.arch }}
          cache-to: type=gha,scope=auto-drive-test-${{ matrix.arch }},mode=max

      - name: Start container
        run: |
          docker run -d --name auto-drive-test -p 127.0.0.1:28640:80 auto-drive-test:ci
          for _ in $(seq 120); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' auto-drive-test)" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs auto-drive-test
          exit 1

      - name: Choose rclone version
        id: rclone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo rclone/rclone --json tagName --jq .tagName)
          if [ "$(printf '%s\n%s\n' "$RCLONE_MIN_RELEASE" "$latest" | sort -V | head -n1)" = "$RCLONE_MIN_RELEASE" ]; then
            ref=$latest
          else
            ref=$RCLONE_SNAPSHOT
          fi
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
          echo "rclone: \`$ref\` (latest release: $latest)" >>"$GITHUB_STEP_SUMMARY"

      # Checked out after the image build so it stays out of the build context.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rclone/rclone
          ref: ${{ steps.rclone.outputs.ref }}
          path: rclone-src
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: rclone-src/go.mod
          cache-dependency-path: rclone-src/go.sum

      - name: Run rclone suite and smoke scripts
        env:
          OUTPUT_DIR: client-test-output
        run: docker/auto-drive-test/client-tests.sh rclone-src

      - name: Record timings
        if: always()
        run: |
          {
            echo "### S3 test image (${{ matrix.arch }})"
            echo
            cat client-test-output/timings.md 2>/dev/null || echo "No client test timings."
            echo
            echo "Image size: $(docker image inspect -f '{{.Size}}' auto-drive-test:ci | numfmt --to=iec)"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p client-test-output/container
          docker logs auto-drive-test >client-test-output/container/docker.log 2>&1 || true
          docker cp auto-drive-test:/var/log/auto-drive-test client-test-output/container/services || true
          docker cp auto-drive-test:/var/log/nginx client-test-output/container/nginx || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auto-drive-test-logs-${{ matrix.arch }}
          path: |
            client-test-output
            !client-test-output/bin
          if-no-files-found: ignore
          retention-days: 14

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The tested image itself, under an architecture-specific tag that the
      # publish job combines into the multi-arch tags.
      - name: Push ${{ matrix.arch }} image
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag auto-drive-test:ci "$IMAGE:${GITHUB_SHA::8}-$ARCH"
          docker push "$IMAGE:${GITHUB_SHA::8}-$ARCH"

  publish:
    name: Publish multi-arch image
    needs: build-test
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sha=${GITHUB_SHA::8}
          tags=(-t "$IMAGE:$sha")
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          if [ -n "$RELEASE_TAG" ]; then
            tags+=(-t "$IMAGE:$RELEASE_TAG")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$sha-amd64" "$IMAGE:$sha-arm64"
          docker buildx imagetools inspect "$IMAGE:$sha"
