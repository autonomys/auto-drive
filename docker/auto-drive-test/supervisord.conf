[supervisord]
nodaemon=true
user=root
; nodaemon already logs to stdout.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D %(ENV_PGDATA)s
user=postgres
priority=10
stopsignal=INT
redirect_stderr=true
stdout_logfile=/var/log/auto-drive-test/postgres.log

[program:rabbitmq]
command=/usr/lib/rabbitmq/bin/rabbitmq-server
user=rabbitmq
environment=HOME="/var/lib/rabbitmq",RABBITMQ_NODENAME="rabbit@localhost",RABBITMQ_NODE_IP_ADDRESS="127.0.0.1",ERL_EPMD_ADDRESS="127.0.0.1"
priority=10
redirect_stderr=true
stdout_logfile=/var/log/auto-drive-test/rabbitmq.log

[program:auth]
command=auto-drive-test-node auth dist/index.js
environment=AUTH_PORT="3030"
user=autodrive
priority=20
startretries=5
redirect_stderr=true
stdout_logfile=/var/log/auto-drive-test/auth.log

[program:download-api]
command=auto-drive-test-node backend dist/app/apis/download.js
environment=PORT="3000"
user=autodrive
priority=20
startretries=5
redirect_stderr=true
stdout_logfile=/var/log/auto-drive-test/download-api.log

; The task manager migrates uploads into node storage. Publishing and archival
; stay off: nothing consumes publish-manager and the archiver flag is unset.
[program:worker]
command=auto-drive-test-node backend dist/app/servers/frontendWorker.js
environment=PORT="3001",TASK_MANAGER_ACTIVE="true"
user=autodrive
priority=20
startretries=5
redirect_stderr=true
stdout_logfile=/var/log/auto-drive-test/worker.log

[program:download-worker]
command=auto-drive-test-node backend dist/app/servers/downloadWorker.js
environment=PORT="3002"
user=autodrive
priority=20
startretries=5
redirect_stderr=true
stdout_logfile=/var/log/auto-drive-test/download-worker.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=false
priority=30
redirect_stderr=true
stdout_logfile=/var/log/auto-drive-test/nginx.log

[program:ready]
command=auto-drive-test-ready
autorestart=false
startsecs=0
priority=40
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
