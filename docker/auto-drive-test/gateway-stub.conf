# Stands in for the files gateway. Reads check its moderation status for every
# object, and archived-object retrieval, its other use, never happens here.
server {
    listen 127.0.0.1:8081;

    location ~ ^/moderation/[^/]+/status$ {
        default_type application/json;
        return 200 '{"isBanned":false}';
    }

    location / {
        return 404;
    }
}
