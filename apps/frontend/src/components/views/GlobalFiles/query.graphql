query GetGlobalFiles(
  $aggregateLimit: Int!
  $limit: Int!
  $offset: Int!
  $orderBy: [metadata_roots_order_by!]
  $search: String
) {
  metadata_roots(
    where: {
      _and: [
        { _or: [{ head_cid: { _ilike: $search } }, { name: { _ilike: $search } }] }
        # Same rows as `is_removed: { _eq: false }`. The row filter already
        # hides objects removed by other owners, so is_removed only needs
        # evaluating for the viewer's own removed rows.
        {
          _not: {
            _and: [
              {
                object_ownership: {
                  is_admin: { _eq: true }
                  marked_as_deleted: { _is_null: false }
                }
              }
              { is_removed: { _eq: true } }
            ]
          }
        }
      ]
    }
    limit: $limit
    offset: $offset
    order_by: $orderBy
  ) {
    cid: head_cid
    tags
    type: metadata(path: "type")
    name: metadata(path: "name")
    mimeType: metadata(path: "mimeType")
    size: metadata(path: "totalSize")
    children: metadata(path: "children")
    createdAt: created_at
    inner_metadata {
      publishedNodes: nodes_aggregate(
        where: { block_published_on: { _is_null: false } }
      ) {
        aggregate {
          count
        }
      }
      archivedNodes: nodes_aggregate(
        where: { piece_offset: { _is_null: false } }
      ) {
        aggregate {
          count
        }
      }
      totalNodes: nodes_aggregate {
        aggregate {
          count
        }
      }
    }
  }
  metadata_roots_aggregate(
    limit: $aggregateLimit
    where: {
      _and: [
        { _or: [{ head_cid: { _ilike: $search } }, { name: { _ilike: $search } }] }
        # Same rows as `is_removed: { _eq: false }`. The row filter already
        # hides objects removed by other owners, so is_removed only needs
        # evaluating for the viewer's own removed rows.
        {
          _not: {
            _and: [
              {
                object_ownership: {
                  is_admin: { _eq: true }
                  marked_as_deleted: { _is_null: false }
                }
              }
              { is_removed: { _eq: true } }
            ]
          }
        }
      ]
    }
  ) {
    aggregate {
      count
    }
  }
}
