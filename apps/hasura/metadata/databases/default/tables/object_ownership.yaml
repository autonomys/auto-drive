table:
  name: object_ownership
  schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - cid
        - oauth_provider
        - oauth_user_id
        - is_admin
        - marked_as_deleted
        - created_at
        - updated_at
      # A user reads only their own ownership rows (any state, so their Trash
      # keeps working). Row filters on metadata and metadata_roots are evaluated
      # against the table itself, so they are unaffected by this filter.
      filter:
        oauth_provider:
          _eq: X-Hasura-Oauth-Provider
        oauth_user_id:
          _eq: X-Hasura-Oauth-User-Id
      allow_aggregations: true
    comment: ""
  - role: app-admin
    permission:
      columns:
        - cid
        - oauth_provider
        - oauth_user_id
        - is_admin
        - marked_as_deleted
        - created_at
        - updated_at
      # Admins see every active ownership row, to show who owns an object, plus
      # their own removed rows.
      filter:
        _or:
          - marked_as_deleted:
              _is_null: true
          - _and:
              - oauth_provider:
                  _eq: X-Hasura-Oauth-Provider
              - oauth_user_id:
                  _eq: X-Hasura-Oauth-User-Id
      allow_aggregations: true
    comment: ""
  - role: anonymous
    permission:
      columns:
        - cid
        - is_admin
        - marked_as_deleted
      # Anonymous clients may reference is_admin / marked_as_deleted to filter
      # public listings, but must never be able to read or enumerate ownership
      # rows that an owner has trashed. Restricting visible rows to the active
      # (non-deleted) ones makes any direct query for deleted rows return empty
      # and forces the marked_as_deleted column to always read as null.
      filter:
        marked_as_deleted:
          _is_null: true
      allow_aggregations: true
    comment: ""
object_relationships:
  - name: metadata
    using:
      manual_configuration:
        column_mapping:
          cid: head_cid
        insertion_order: null
        remote_table:
          name: metadata
      schema: public
